<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2D5BFF" />
  <title>OfficeDesk — Task & Problem Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='8' fill='%232D5BFF'/><text x='18' y='24' text-anchor='middle' fill='white' font-size='20' font-weight='bold'>O</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#F3F4F8;color:#1A1D23;-webkit-tap-highlight-color:transparent}
    select,input,textarea,button{font-family:inherit}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes bar{0%{left:-40%}100%{left:100%}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-dot{animation:pulse 1.4s ease-in-out infinite}
    .loading-dot:nth-child(2){animation-delay:.2s}.loading-dot:nth-child(3){animation-delay:.4s}
    .topbar{position:fixed;top:0;left:0;right:0;height:3px;background:#E5E7EB;z-index:1200;overflow:hidden}
    .topbar span{position:absolute;top:0;height:3px;width:40%;background:#2D5BFF;animation:bar 1s linear infinite}
    .spin{display:inline-block;width:12px;height:12px;border:2px solid #C7D2FE;border-top-color:#2D5BFF;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}

    /* bottom tab bar — mobile only */
    .tabbar{display:none}

    @media(max-width:768px){
      .app-layout{flex-direction:column!important}
      .sidebar{display:none!important}
      .main-content{padding:14px 14px 90px!important;max-height:none!important}
      .stat-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}
      .stat-row>div{min-width:0!important;padding:14px!important}
      .form-row{flex-direction:column!important;gap:14px!important}
      .header-inner{padding:0 12px!important;height:56px!important;position:sticky;top:0;z-index:900}
      .hide-sm{display:none!important}
      .card{padding:16px!important}
      .phone-grid{grid-template-columns:1fr!important}
      .act{width:100%!important;justify-content:center!important}
      .act-row{flex-direction:column!important;width:100%!important}
      input,select,textarea{font-size:16px!important} /* stops iOS zoom-on-focus */
      h2{font-size:19px!important}
      .sheet{align-items:flex-end!important}
      .sheet-inner{width:100%!important;max-width:none!important;border-radius:18px 18px 0 0!important;animation:slideUp .22s ease-out!important;max-height:88vh!important}
      .tabbar{
        display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:950;
        background:#fff;border-top:1px solid #E5E7EB;
        padding:6px 2px calc(6px + env(safe-area-inset-bottom));
        box-shadow:0 -2px 12px #0000000d
      }
      .tabbtn{
        flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;
        gap:3px;padding:7px 1px;font-size:9.5px;font-weight:600;cursor:pointer;border-radius:10px
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ╔══════════════════════════════════════════════════════════════╗
// ║  CONFIGURATION                                              ║
// ╚══════════════════════════════════════════════════════════════╝
const CONFIG = {
  GOOGLE_CLIENT_ID: '768240328001-153jkt92ph1ai4adgk69hdeg8amchtj5.apps.googleusercontent.com',
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxBSNOkK_KrHJ7I5X5ihA7c1ouN6kdst1Lu6jxAFS2nAxosJIYRcbwnhH9KQJYt8a5z/exec'
};

// ──────────── CONSTANTS ────────────
const CATEGORIES = ["General Issue", "IT / Computer", "Maintenance", "Follow-up", "Other"];
const TYPES = ["Issue", "Task", "Request", "Complaint"];

// A Complaint carries no due date
const needsDue = (type) => type !== "Complaint";

// "Ms. Pooja" → "Pooja" (drops the honorific so greetings read naturally)
const firstName = (n) => {
  const parts = String(n || "").trim().split(/\s+/)
    .filter(p => !/^(mr|mrs|ms|miss|dr|shri|smt)\.?$/i.test(p));
  return parts[0] || String(n || "");
};

const typeColor = (t) => ({ Issue: "#EF4444", Task: "#2563EB", Request: "#0891B2", Complaint: "#F59E0B" }[t] || "#6B7280");
const statusColor = (s) => ({
  Open: "#8B5CF6", Assigned: "#2563EB", Pending: "#8B5CF6", Accepted: "#0891B2",
  "In Progress": "#F59E0B", Resolved: "#10B981",
  Completed: "#10B981", Closed: "#6B7280"
}[s] || "#6B7280");

const sameMail = (a, b) => String(a || "").toLowerCase().trim() === String(b || "").toLowerCase().trim();
const cleanPhone = (p) => String(p || "").replace(/[^\d+]/g, "");
const waNumber = (p) => {
  const d = cleanPhone(p).replace(/^\+/, "");
  return d.length === 10 ? "91" + d : d;
};
const todayISO = () => new Date().toISOString().slice(0, 10);

// ──────────── API HELPER ────────────
async function api(action, data = {}) {
  const resp = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...data }),
    redirect: 'follow'
  });
  if (!resp.ok) throw new Error('Server replied ' + resp.status);
  const text = await resp.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error('Bad response from server — redeploy the Apps Script as a NEW version.');
  }
}

// ──────────── SMALL COMPONENTS ────────────
function Badge({ text, color }) {
  return <span style={{ display: "inline-block", padding: "2px 9px", borderRadius: 999, fontSize: 10.5, fontWeight: 700, letterSpacing: 0.3, background: color + "18", color, border: `1px solid ${color}40`, textTransform: "uppercase" }}>{text}</span>;
}

function Avatar({ initials, size = 36, color = "#2D5BFF", picture }) {
  if (picture) return <img src={picture} alt="" style={{ width: size, height: size, borderRadius: "50%", objectFit: "cover", flexShrink: 0 }} referrerPolicy="no-referrer" />;
  return <div style={{ width: size, height: size, borderRadius: "50%", background: color + "16", color, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: size * 0.36, letterSpacing: 0.5, flexShrink: 0 }}>{initials}</div>;
}

function StatCard({ label, value, color, icon, onClick }) {
  return (
    <div onClick={onClick}
      style={{ background: "#fff", borderRadius: 12, padding: "18px 20px", flex: 1, minWidth: 130, boxShadow: "0 1px 3px #0001", border: "1px solid #E5E7EB", cursor: onClick ? "pointer" : "default" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{ fontSize: 18 }}>{icon}</span>
        <span style={{ fontSize: 10.5, color: "#6B7280", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</span>
      </div>
      <div style={{ fontSize: 28, fontWeight: 800, color }}>{value}</div>
    </div>
  );
}

function EmptyState({ icon, title, subtitle }) {
  return (
    <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5E7EB", padding: "40px 20px", textAlign: "center", color: "#9CA3AF" }}>
      <div style={{ fontSize: 38, marginBottom: 10 }}>{icon}</div>
      <div style={{ fontWeight: 600, fontSize: 15 }}>{title}</div>
      {subtitle && <div style={{ fontSize: 13, marginTop: 4 }}>{subtitle}</div>}
    </div>
  );
}

function LoadingSpinner({ text = "Loading..." }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: 220, gap: 14 }}>
      <div style={{ display: "flex", gap: 6 }}>
        <div className="loading-dot" style={{ width: 10, height: 10, borderRadius: "50%", background: "#2D5BFF" }} />
        <div className="loading-dot" style={{ width: 10, height: 10, borderRadius: "50%", background: "#2D5BFF" }} />
        <div className="loading-dot" style={{ width: 10, height: 10, borderRadius: "50%", background: "#2D5BFF" }} />
      </div>
      <div style={{ fontSize: 14, color: "#6B7280", fontWeight: 500 }}>{text}</div>
    </div>
  );
}

function ErrorPanel({ message, onRetry, busy }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #FECACA", borderRadius: 12, padding: 20, maxWidth: 620 }}>
      <div style={{ fontWeight: 700, fontSize: 15, color: "#DC2626", marginBottom: 6 }}>Couldn't load data</div>
      <div style={{ fontSize: 13, color: "#6B7280", lineHeight: 1.6, marginBottom: 14, wordBreak: "break-word" }}>{message}</div>
      <button onClick={onRetry} disabled={busy}
        style={{ padding: "11px 20px", borderRadius: 10, border: "none", background: "#2D5BFF", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", opacity: busy ? 0.6 : 1 }}>
        {busy ? <span><span className="spin" /> Retrying…</span> : "Try again"}
      </button>
    </div>
  );
}

// Bottom-sheet on phone, centered dialog on desktop
function Sheet({ title, children, onClose }) {
  return (
    <div className="sheet" onClick={onClose}
      style={{ position: "fixed", inset: 0, background: "#00000055", zIndex: 1100, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div className="sheet-inner" onClick={e => e.stopPropagation()}
        style={{ background: "#fff", borderRadius: 16, padding: 22, width: "100%", maxWidth: 440, maxHeight: "85vh", overflowY: "auto", boxShadow: "0 10px 40px #0003" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, gap: 12 }}>
          <div style={{ fontWeight: 700, fontSize: 16 }}>{title}</div>
          <button onClick={onClose} style={{ border: "none", background: "#F3F4F6", width: 30, height: 30, borderRadius: "50%", cursor: "pointer", fontSize: 15, color: "#6B7280" }}>{"\u2715"}</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ──────────── PHONE CARD ────────────
function PhoneCard({ emp, isSelf }) {
  const phone = cleanPhone(emp.phone);
  const btn = { flex: 1, padding: "12px", borderRadius: 10, fontSize: 14, fontWeight: 600, textDecoration: "none", textAlign: "center", display: "block" };
  return (
    <div className="card" style={{ background: "#fff", borderRadius: 12, border: `1px solid ${isSelf ? "#C7D2FE" : "#E5E7EB"}`, padding: 18 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
        <Avatar initials={emp.avatar} size={44} color={emp.role === "EA" ? "#7C3AED" : "#2D5BFF"} />
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>{emp.name}{isSelf && <span style={{ fontSize: 11, color: "#6B7280", fontWeight: 500 }}> · you</span>}</div>
          <div style={{ fontSize: 12, color: "#9CA3AF" }}>{emp.dept} · {emp.role}</div>
          <div style={{ fontSize: 13, color: "#374151", marginTop: 3, fontFamily: "monospace" }}>{emp.phone || "No number saved"}</div>
        </div>
      </div>
      {phone ? (
        <div style={{ display: "flex", gap: 8 }}>
          <a href={`tel:${phone}`} style={{ ...btn, background: "#EEF2FF", color: "#2D5BFF" }}>{"\u{1F4DE}"} Call</a>
          <a href={`https://wa.me/${waNumber(emp.phone)}`} target="_blank" rel="noreferrer" style={{ ...btn, background: "#DCFCE7", color: "#15803D" }}>{"\u{1F4AC}"} WhatsApp</a>
        </div>
      ) : (
        <div style={{ fontSize: 12, color: "#9CA3AF" }}>Add a number in the Employees sheet (column G) to enable calling.</div>
      )}
    </div>
  );
}

// ──────────── ACCEPTANCE STRIP (shown on task cards) ────────────
function ResponseInfo({ t, forEA }) {
  if (!t.response) return null;
  return (
    <div style={{
      marginTop: 10, padding: "10px 12px", borderRadius: 9,
      background: "#ECFEFF", border: "1px solid #A5F3FC",
      fontSize: 12.5, color: "#0E7490", lineHeight: 1.6
    }}>
      <strong>{forEA ? (t.assigneeName || t.assignedTo) + " accepted" : "You accepted this task"}</strong>
      <div style={{ marginTop: 3 }}>Will complete by <strong>{t.promisedDate || "—"}</strong></div>
      {t.responseNote && <div style={{ marginTop: 3 }}>Note: {t.responseNote}</div>}
      {t.respondedOn && <div style={{ marginTop: 3, opacity: 0.75 }}>Responded on {t.respondedOn}</div>}
      {t.completedAt && <div style={{ marginTop: 3, color: "#15803D", fontWeight: 600 }}>{"\u2705"} Completed on {t.completedAt}</div>}
    </div>
  );
}

// ──────────── PROGRESS STRIP for the person who SENT the request ────────────
function ReporterTaskInfo({ t }) {
  if (!t) return null;
  const done = t.status === "Completed";
  return (
    <div style={{
      marginTop: 10, padding: "10px 12px", borderRadius: 9,
      background: done ? "#F0FDF4" : "#F8FAFC",
      border: `1px solid ${done ? "#BBF7D0" : "#E2E8F0"}`,
      fontSize: 12.5, color: "#334155", lineHeight: 1.6
    }}>
      <div style={{ fontWeight: 700, color: "#0F172A" }}>
        {"\u{1F4CC}"} {t.id} · with {t.assigneeName || t.assignedTo}
      </div>
      {t.dueDate && <div style={{ marginTop: 3 }}>Due date given: <strong>{t.dueDate}</strong></div>}
      {t.response
        ? <>
            <div style={{ marginTop: 3 }}>Accepted — will complete by <strong>{t.promisedDate || "—"}</strong></div>
            {t.responseNote && <div style={{ marginTop: 3 }}>Their note: {t.responseNote}</div>}
            {t.respondedOn && <div style={{ marginTop: 3, opacity: 0.75 }}>Responded on {t.respondedOn}</div>}
          </>
        : <div style={{ marginTop: 3, opacity: 0.8 }}>{"\u{23F3}"} Not accepted yet</div>}
      {t.completedAt && <div style={{ marginTop: 3, color: "#15803D", fontWeight: 600 }}>{"\u2705"} Completed on {t.completedAt}</div>}
    </div>
  );
}

// ══════════════════════════════════════════════════
// ║  LOGIN SCREEN
// ══════════════════════════════════════════════════
function LoginScreen({ onLogin }) {
  const [error, setError] = useState(null);
  const [checking, setChecking] = useState(false);
  const btnRef = useRef(null);

  useEffect(() => {
    const initGSI = () => {
      if (!window.google?.accounts) { setTimeout(initGSI, 200); return; }
      google.accounts.id.initialize({
        client_id: CONFIG.GOOGLE_CLIENT_ID,
        callback: handleCredential,
        auto_select: false,
      });
      google.accounts.id.renderButton(btnRef.current, {
        theme: 'outline', size: 'large', width: 300, text: 'signin_with', shape: 'rectangular'
      });
    };
    initGSI();
  }, []);

  const handleCredential = async (response) => {
    setChecking(true); setError(null);
    try {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      const result = await api('login', { email: payload.email });

      if (result.success) {
        const session = {
          employee: result.employee, email: payload.email,
          picture: payload.picture, credential: response.credential,
          loginTime: Date.now()
        };
        sessionStorage.setItem('officedesk_session', JSON.stringify(session));
        onLogin(session);
      } else {
        setError(result.error || 'Login failed. Your email is not authorized.');
      }
    } catch (err) {
      setError(err.message || 'Connection error. Check your internet and try again.');
    }
    setChecking(false);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg, #F3F4F8 0%, #E8ECFF 100%)", padding: 16 }}>
      <div style={{ background: "#fff", borderRadius: 20, padding: "40px 26px", maxWidth: 420, width: "100%", boxShadow: "0 8px 40px #2D5BFF12", textAlign: "center", border: "1px solid #E5E7EB" }}>

        <img src="logo.png" alt="Office Logo" style={{ height: 66, marginBottom: 18, objectFit: "contain" }}
          onError={(e) => { e.target.style.display = 'none'; }} />

        <h1 style={{ fontSize: 23, fontWeight: 800, marginBottom: 4, color: "#1A1D23" }}>OfficeDesk</h1>
        <p style={{ fontSize: 14, color: "#6B7280", marginBottom: 28, lineHeight: 1.5 }}>
          Task & Problem Management System<br />
          <span style={{ fontSize: 12 }}>Sign in with your authorized Gmail to continue</span>
        </p>

        {checking ? (
          <LoadingSpinner text="Verifying your access..." />
        ) : (
          <div style={{ display: "flex", justifyContent: "center" }}>
            <div ref={btnRef}></div>
          </div>
        )}

        {error && (
          <div style={{ marginTop: 18, padding: "12px 14px", background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 10, color: "#DC2626", fontSize: 13, fontWeight: 500, animation: "fadeIn 0.3s" }}>
            {error}
          </div>
        )}

        <div style={{ marginTop: 26, fontSize: 11, color: "#9CA3AF" }}>
          Only authorized employees can access this system
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════
// ║  MAIN APP
// ══════════════════════════════════════════════════
function Dashboard({ session, onLogout }) {
  const [view, setView] = useState("dashboard");
  const [problems, setProblems] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [loading, setLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [notification, setNotification] = useState(null);
  const [problemForm, setProblemForm] = useState({ title: "", category: "General Issue", type: "Issue", description: "", suggestedTo: "", dueDate: "" });
  const [taskForm, setTaskForm] = useState({ title: "", description: "", assignedTo: "", type: "Task", dueDate: "", linkedProblem: "" });
  const [respond, setRespond] = useState(null);       // task being accepted
  const [respForm, setRespForm] = useState({ promisedDate: "", note: "" });
  const [changing, setChanging] = useState(null);     // task whose person the EA is changing
  const [newAssignee, setNewAssignee] = useState("");

  const user = session.employee;
  const isEA = user.role === 'EA';

  const notify = (msg, isError = false) => {
    setNotification({ msg, isError });
    setTimeout(() => setNotification(null), 4000);
  };

  // ── Load data ── (failures go to loadError, never a toast)
  const refreshData = useCallback(async () => {
    setRefreshing(true);
    try {
      const result = await api('getAllData', { email: session.email });
      if (result.success) {
        setProblems(result.problems || []);
        setTasks(result.tasks || []);
        setEmployees(result.employees || []);
        setLoadError(null);
      } else {
        setLoadError(result.error || 'The server returned no data.');
      }
    } catch (err) {
      setLoadError(err.message || 'Connection error. Check your internet.');
    }
    setRefreshing(false);
    setLoading(false);
  }, [session.email]);

  useEffect(() => { refreshData(); }, [refreshData]);

  // ── Submit Request ── (with a person chosen it goes straight to them)
  const submitProblem = async () => {
    if (!problemForm.title.trim()) { notify("Please enter a title", true); return; }
    if (needsDue(problemForm.type) && problemForm.suggestedTo && !problemForm.dueDate) {
      notify("Please give a due date for that person", true); return;
    }
    setSaving(true);
    let sentTo = null;   // "" when nobody was chosen, name when it went straight to someone
    try {
      const result = await api('addProblem', { email: session.email, ...problemForm });
      if (result.success) {
        sentTo = result.assigneeName || "";
        setProblemForm({ title: "", category: "General Issue", type: "Issue", description: "", suggestedTo: "", dueDate: "" });
      } else { notify(result.error, true); }
    } catch (err) { notify(err.message || "Failed to submit", true); }
    setSaving(false);

    if (sentTo !== null) {
      await refreshData();
      notify(sentTo ? "Sent directly to " + sentTo : "Saved — the EA will assign it");
      setView("tracking");
    }
  };

  // ── Submit Task ──
  const submitTask = async () => {
    if (!taskForm.title.trim()) { notify("Please enter a task title", true); return; }
    if (!taskForm.assignedTo) { notify("Please select an employee", true); return; }
    if (needsDue(taskForm.type) && !taskForm.dueDate) { notify("Please give a due date", true); return; }
    setSaving(true);
    let assignedName = "";
    try {
      const result = await api('addTask', { email: session.email, ...taskForm });
      if (result.success) {
        assignedName = result.task?.assigneeName || "employee";
        setTaskForm({ title: "", description: "", assignedTo: "", type: "Task", dueDate: "", linkedProblem: "" });
      } else { notify(result.error, true); }
    } catch (err) { notify(err.message || "Failed to assign", true); }
    setSaving(false);

    if (assignedName) { await refreshData(); notify("Task assigned to " + assignedName + "!"); setView("pending"); }
  };

  // ── Accept a task (with a promised date) ──
  const openRespond = (task) => {
    setRespForm({ promisedDate: "", note: "" });
    setRespond(task);
  };

  const submitResponse = async () => {
    if (!respond) return;
    if (!respForm.promisedDate) { notify("Please choose the date you'll finish by", true); return; }

    const taskId = respond.id;
    setRespond(null);
    setSaving(true);
    let ok = false;
    try {
      const result = await api('respondToTask', {
        email: session.email, taskId,
        note: respForm.note, promisedDate: respForm.promisedDate
      });
      if (result.success) ok = true; else notify(result.error, true);
    } catch (err) { notify(err.message || "Failed to send response", true); }
    setSaving(false);

    if (ok) { await refreshData(); notify("Accepted — date sent"); }
  };

  // ── EA changes the assigned person ──
  const openChange = (task) => {
    setNewAssignee(task.assignedTo || "");
    setChanging(task);
  };

  const submitChange = async () => {
    if (!changing) return;
    if (!newAssignee) { notify("Please select a person", true); return; }
    if (newAssignee === changing.assignedTo) { notify("That's the same person", true); return; }

    const taskId = changing.id;
    setChanging(null);
    setSaving(true);
    let name = "";
    try {
      const result = await api('reassignTask', { email: session.email, taskId, assignedTo: newAssignee });
      if (result.success) name = result.assigneeName || "the new person";
      else notify(result.error, true);
    } catch (err) { notify(err.message || "Failed to change person", true); }
    setSaving(false);

    if (name) { await refreshData(); notify("Task moved to " + name); }
  };

  // ── Update Task Status ──
  const updateTaskStatus = async (taskId, newStatus) => {
    setSaving(true);
    let ok = false;
    try {
      const result = await api('updateTaskStatus', { email: session.email, taskId, newStatus });
      if (result.success) ok = true; else notify(result.error, true);
    } catch (err) { notify(err.message || "Failed to update", true); }
    setSaving(false);
    if (ok) {
      await refreshData();
      notify(newStatus === "Completed" ? "Done! Moved to Completed on your Dashboard" : "Task updated to " + newStatus);
    }
  };

  const handleLogout = () => {
    sessionStorage.removeItem('officedesk_session');
    if (window.google?.accounts) google.accounts.id.disableAutoSelect();
    onLogout();
  };

  // Requests nobody was named on — only these ever need the EA
  const unassignedProblems = problems.filter(p => p.status === "Open" && !p.suggestedTo);
  // Everything still outstanding (EA view of the whole office)
  const pendingTasks = tasks.filter(t => t.status !== "Completed");
  const notAcceptedTasks = pendingTasks.filter(t => !t.response);
  const overdueTasks = pendingTasks.filter(t => t.dueDate && t.dueDate < todayISO());
  // Tasks assigned to ME — the EA has her own tasks too
  const myTasks = tasks.filter(t => sameMail(t.assignedTo, session.email));
  const myOpenTasks = myTasks.filter(t => t.status !== "Completed");   // shown in My Task
  const completedTasks = (isEA ? tasks : myTasks)
    .filter(t => t.status === "Completed")
    .sort((a, b) => String(b.completedAt || b.createdDate).localeCompare(String(a.completedAt || a.createdDate)));
  const myProblems = problems.filter(p => isEA ? sameMail(p.reportedBy, session.email) : true);
  // Every task raised from a request — a request can have more than one
  const tasksForProblem = (pid) => tasks.filter(t => t.linkedProblem === pid);

  const navItems = isEA
    ? [{ key: "dashboard", label: "Dashboard", icon: "\u{1F4CA}" },
       { key: "report", label: "New Request", icon: "\u{1F6A8}" },
       { key: "mytasks", label: "My Task", icon: "\u{2705}" },
       { key: "tracking", label: "Task Tracking", icon: "\u{1F4CB}" },
       { key: "pending", label: "Pending", icon: "\u{23F3}" },
       { key: "team", label: "Contact", icon: "\u{1F4DE}" }]
    : [{ key: "dashboard", label: "Dashboard", icon: "\u{1F4CA}" },
       { key: "report", label: "New Request", icon: "\u{1F6A8}" },
       { key: "mytasks", label: "My Task", icon: "\u{2705}" },
       { key: "tracking", label: "Task Tracking", icon: "\u{1F4CB}" },
       { key: "team", label: "Contact", icon: "\u{1F4DE}" }];

  const inp = { width: "100%", padding: "12px 14px", borderRadius: 10, border: "1px solid #D1D5DB", fontSize: 14, outline: "none", fontFamily: "inherit", boxSizing: "border-box", background: "#FAFBFC" };
  const lbl = { display: "block", marginBottom: 5, fontSize: 12, fontWeight: 600, color: "#374151", letterSpacing: 0.3 };
  const btnP = { padding: "12px 22px", borderRadius: 10, border: "none", background: "#2D5BFF", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" };
  const btnS = { ...btnP, background: "#F3F4F6", color: "#374151" };

  if (loading) return <LoadingSpinner text="Loading your workspace..." />;

  const getName = (email) => {
    const emp = employees.find(e => e.email === email);
    return emp ? emp.name : (email || "Unknown");
  };

  // Everyone in the Employees sheet except yourself
  const suggestableEmployees = employees.filter(e => e.email !== session.email);

  // ── Recent Activity rows (requests + tasks, newest first, with full detail) ──
  const activity = [
    ...myProblems.map(p => ({ kind: "problem", data: p, date: p.date })),
    ...(isEA ? tasks : myTasks).map(t => ({ kind: "task", data: t, date: t.createdDate }))
  ].sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 8);

  // ── Task card as the EA sees it (tracking / pending) ──
  const eaTaskCard = (t) => {
    const overdue = t.dueDate && t.dueDate < todayISO() && t.status !== "Completed";
    return (
      <div key={t.id} className="card" style={{ background: "#fff", borderRadius: 12, border: `1px solid ${t.status === "Completed" ? "#D1FAE5" : overdue ? "#FECACA" : "#E5E7EB"}`, padding: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 7, flexWrap: "wrap" }}>
          <span style={{ fontFamily: "monospace", fontSize: 12, color: "#9CA3AF" }}>{t.id}</span>
          {t.type && <Badge text={t.type} color={typeColor(t.type)} />}
          <Badge text={t.status} color={statusColor(t.status)} />
          {overdue && <Badge text="Overdue" color="#DC2626" />}
        </div>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 5 }}>{t.title}</div>
        {t.description && <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 7, lineHeight: 1.55 }}>{t.description}</div>}
        <div style={{ display: "flex", gap: 14, fontSize: 12, color: "#9CA3AF", flexWrap: "wrap" }}>
          <span>{"\u{1F464}"} {t.assigneeName || t.assignedTo}</span>
          {t.dueDate && <span style={{ color: overdue ? "#DC2626" : "#B45309", fontWeight: 600 }}>Due: {t.dueDate}</span>}
          {t.reportedBy && <span>From: {getName(t.reportedBy)}</span>}
          {t.linkedProblem && <span>Linked: {t.linkedProblem}</span>}
          <span>Created: {t.createdDate}</span>
        </div>

        <ResponseInfo t={t} forEA={true} />

        {!t.response && t.status === "Pending" && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: "#9CA3AF" }}>{"\u{23F3}"} Waiting for {t.assigneeName || t.assignedTo} to accept</div>
        )}

        {t.status !== "Completed" && (
          <div className="act-row" style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
            <button className="act" style={{ ...btnS, color: "#6D28D9", background: "#F5F3FF", fontSize: 13.5, padding: "11px 16px" }}
              onClick={() => openChange(t)}>
              {"\u{1F464}"} Change person
            </button>
          </div>
        )}
      </div>
    );
  };

  // ── Task card as the assignee sees it (My Task — everyone, EA included) ──
  const myTaskCard = (t) => {
    const overdue = t.dueDate && t.dueDate < todayISO() && t.status !== "Completed";
    return (
      <div key={t.id} className="card" style={{ background: "#fff", borderRadius: 12, border: `1px solid ${overdue ? "#FECACA" : "#E5E7EB"}`, padding: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 7, flexWrap: "wrap" }}>
          <span style={{ fontFamily: "monospace", fontSize: 12, color: "#9CA3AF" }}>{t.id}</span>
          {t.type && <Badge text={t.type} color={typeColor(t.type)} />}
          <Badge text={t.status} color={statusColor(t.status)} />
          {overdue && <Badge text="Overdue" color="#DC2626" />}
        </div>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 5 }}>{t.title}</div>
        {t.description && <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 7, lineHeight: 1.55 }}>{t.description}</div>}
        <div style={{ fontSize: 12, color: "#9CA3AF" }}>
          {t.dueDate ? <span style={{ color: overdue ? "#DC2626" : "#B45309", fontWeight: 600 }}>Due: {t.dueDate} · </span> : null}
          Assigned on {t.createdDate}
          {t.reportedBy && <span> · From: {getName(t.reportedBy)}</span>}
          {t.linkedProblem && <span> · Linked: {t.linkedProblem}</span>}
        </div>

        <ResponseInfo t={t} forEA={false} />

        <div className="act-row" style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
          {t.status === "Pending" && (
            <button className="act" style={{ ...btnP, background: "#0891B2", fontSize: 13.5, padding: "11px 16px" }} onClick={() => openRespond(t)}>{"\u2713"} I'll do it — give date</button>
          )}
          {t.status === "Accepted" && (
            <button className="act" style={{ ...btnP, fontSize: 13.5, padding: "11px 16px" }} onClick={() => updateTaskStatus(t.id, "In Progress")}>{"\u{25B6}"} Start Task</button>
          )}
          {t.status === "In Progress" && (
            <button className="act" style={{ ...btnP, background: "#10B981", fontSize: 13.5, padding: "11px 16px" }} onClick={() => updateTaskStatus(t.id, "Completed")}>{"\u2713"} Mark Done</button>
          )}
        </div>
      </div>
    );
  };

  return (
    <div style={{ minHeight: "100vh" }}>

      {refreshing && <div className="topbar"><span /></div>}

      {/* Notification */}
      {notification && (
        <div style={{ position: "fixed", top: 12, left: 12, right: 12, margin: "0 auto", maxWidth: 380, background: notification.isError ? "#EF4444" : "#10B981", color: "#fff", padding: "12px 18px", borderRadius: 12, fontWeight: 600, fontSize: 13.5, zIndex: 1300, boxShadow: "0 6px 24px #00000030", animation: "fadeIn 0.3s", textAlign: "center" }}>
          {notification.isError ? "\u2718" : "\u2713"} {notification.msg}
        </div>
      )}

      {/* Saving overlay */}
      {saving && (
        <div style={{ position: "fixed", inset: 0, background: "#00000020", zIndex: 1250, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ background: "#fff", borderRadius: 14, padding: "16px 30px", boxShadow: "0 4px 20px #0002" }}>
            <LoadingSpinner text="Saving..." />
          </div>
        </div>
      )}

      {/* Accept sheet */}
      {respond && (
        <Sheet title="Accept task" onClose={() => setRespond(null)}>
          <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 16, lineHeight: 1.55 }}>
            <strong style={{ color: "#1A1D23" }}>{respond.title}</strong>
          </div>
          <div style={{ marginBottom: 16 }}>
            <label style={lbl}>I will complete it by *</label>
            <input type="date" style={inp} value={respForm.promisedDate}
              onChange={e => setRespForm(f => ({ ...f, promisedDate: e.target.value }))} />
            {respond.dueDate && <div style={{ fontSize: 11.5, color: "#9CA3AF", marginTop: 5 }}>Due date given to you: {respond.dueDate}</div>}
          </div>
          <div style={{ marginBottom: 20 }}>
            <label style={lbl}>Note (optional)</label>
            <textarea style={{ ...inp, minHeight: 76, resize: "vertical" }} placeholder="e.g., will start after the dispatch rush"
              value={respForm.note} onChange={e => setRespForm(f => ({ ...f, note: e.target.value }))} />
          </div>
          <button style={{ ...btnP, width: "100%", background: "#0891B2" }} onClick={submitResponse}>{"\u2713"} Accept & send date</button>
        </Sheet>
      )}

      {/* EA: change person sheet */}
      {changing && (
        <Sheet title="Change assigned person" onClose={() => setChanging(null)}>
          <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 16, lineHeight: 1.55 }}>
            <strong style={{ color: "#1A1D23" }}>{changing.title}</strong>
            <div style={{ marginTop: 4 }}>Currently with {changing.assigneeName || changing.assignedTo}</div>
          </div>
          <div style={{ marginBottom: 16 }}>
            <label style={lbl}>New person *</label>
            <select style={inp} value={newAssignee} onChange={e => setNewAssignee(e.target.value)}>
              <option value="">-- Select Employee --</option>
              {employees.filter(e => e.role !== "EA").map(e => <option key={e.email} value={e.email}>{e.name} — {e.dept}</option>)}
            </select>
          </div>
          <div style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 9, padding: "10px 13px", marginBottom: 20, fontSize: 12.5, color: "#92400E", lineHeight: 1.55 }}>
            Task वापस <strong>Pending</strong> हो जाएगा और नया व्यक्ति अपनी date देकर accept करेगा.
          </div>
          <button style={{ ...btnP, width: "100%", background: "#7C3AED" }} onClick={submitChange}>Move task to this person</button>
        </Sheet>
      )}

      {/* Header */}
      <header className="header-inner" style={{ background: "#fff", borderBottom: "1px solid #E5E7EB", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 24px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <img src="logo.png" alt="" style={{ height: 34, objectFit: "contain" }}
            onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} />
          <div style={{ width: 34, height: 34, borderRadius: 8, background: "linear-gradient(135deg, #2D5BFF, #7C3AED)", display: "none", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 800, fontSize: 16, flexShrink: 0 }}>O</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15.5, lineHeight: 1.2 }}>OfficeDesk</div>
            <div style={{ fontSize: 11, color: "#6B7280", fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              {refreshing ? <span><span className="spin" /> Refreshing…</span> : user.name}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
          <div className="hide-sm" style={{ textAlign: "right" }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{user.name}</div>
            <div style={{ fontSize: 11, color: "#9CA3AF" }}>{user.role} · {user.dept}</div>
          </div>
          <button onClick={refreshData} disabled={refreshing} title="Refresh"
            style={{ width: 38, height: 38, borderRadius: 10, border: "1px solid #E5E7EB", background: "#fff", cursor: "pointer", fontSize: 16, opacity: refreshing ? 0.5 : 1 }}>
            {"\u{1F504}"}
          </button>
          <Avatar initials={user.avatar} picture={session.picture} color={isEA ? "#7C3AED" : "#2D5BFF"} size={34} />
          <button onClick={handleLogout} title="Sign out" className="hide-sm"
            style={{ padding: "8px 12px", borderRadius: 8, border: "1px solid #E5E7EB", background: "#fff", cursor: "pointer", fontSize: 12, color: "#6B7280", fontWeight: 500 }}>
            Sign out
          </button>
        </div>
      </header>

      <div className="app-layout" style={{ display: "flex", minHeight: "calc(100vh - 64px)" }}>

        {/* Sidebar — desktop */}
        <nav className="sidebar" style={{ width: 220, background: "#fff", borderRight: "1px solid #E5E7EB", padding: "20px 0", flexShrink: 0 }}>
          <div style={{ padding: "0 16px 16px", borderBottom: "1px solid #F3F4F6", marginBottom: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>
              {isEA ? "EA Panel" : "Employee Panel"}
            </div>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#374151" }}>{user.name}</div>
            <div style={{ fontSize: 11, color: "#9CA3AF" }}>{user.dept}</div>
          </div>
          <div>
            {navItems.map(item => (
              <button key={item.key} onClick={() => setView(item.key)}
                style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "11px 20px", border: "none",
                  background: view === item.key ? "#EEF2FF" : "transparent",
                  color: view === item.key ? "#2D5BFF" : "#4B5563",
                  fontSize: 13.5, fontWeight: view === item.key ? 600 : 500, cursor: "pointer", fontFamily: "inherit", textAlign: "left",
                  borderRight: view === item.key ? "3px solid #2D5BFF" : "3px solid transparent" }}>
                <span style={{ fontSize: 16 }}>{item.icon}</span> {item.label}
                {item.key === "pending" && pendingTasks.length + unassignedProblems.length > 0 && (
                  <span style={{ marginLeft: "auto", background: "#EF4444", color: "#fff", borderRadius: 999, fontSize: 10.5, fontWeight: 700, padding: "1px 7px" }}>
                    {pendingTasks.length + unassignedProblems.length}
                  </span>
                )}
                {item.key === "mytasks" && myOpenTasks.length > 0 && (
                  <span style={{ marginLeft: "auto", background: "#2D5BFF", color: "#fff", borderRadius: 999, fontSize: 10.5, fontWeight: 700, padding: "1px 7px" }}>
                    {myOpenTasks.length}
                  </span>
                )}
              </button>
            ))}
          </div>
          <div style={{ padding: "12px 16px", marginTop: 12, borderTop: "1px solid #F3F4F6" }}>
            <button onClick={refreshData} disabled={refreshing}
              style={{ ...btnS, width: "100%", fontSize: 12, padding: "10px 12px", opacity: refreshing ? 0.65 : 1 }}>
              {refreshing ? <span><span className="spin" /> Refreshing…</span> : <span>{"\u{1F504}"} Refresh Data</span>}
            </button>
          </div>
        </nav>

        {/* Main Content */}
        <main className="main-content" style={{ flex: 1, padding: 26, overflowY: "auto", maxHeight: "calc(100vh - 64px)", minWidth: 0 }}>

          {loadError && (
            <div style={{ marginBottom: 20 }}>
              <ErrorPanel message={loadError} onRetry={refreshData} busy={refreshing} />
            </div>
          )}

          {/* ═══ DASHBOARD ═══ */}
          {view === "dashboard" && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>Hi, {firstName(user.name)}</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>{isEA ? "Your tasks, plus everything across the office" : "Your tasks and requests"}</p>

              <div className="stat-row" style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 24 }}>
                <StatCard label="My Task" value={myOpenTasks.length} color="#2D5BFF" icon={"\u{2705}"} onClick={() => setView("mytasks")} />
                <StatCard label={isEA ? "Office Pending" : "My Requests"} value={isEA ? pendingTasks.length : myProblems.length} color="#8B5CF6" icon={"\u{23F3}"} onClick={() => setView(isEA ? "pending" : "tracking")} />
                <StatCard label={isEA ? "Overdue" : "In Progress"} value={isEA ? overdueTasks.length : myOpenTasks.filter(t => t.status === "In Progress").length} color={isEA ? "#EF4444" : "#F59E0B"} icon={isEA ? "\u{26A0}" : "\u{23F3}"} onClick={isEA ? () => setView("pending") : null} />
                <StatCard label="Completed" value={completedTasks.length} color="#10B981" icon={"\u{1F389}"} />
              </div>

              {/* ── Completed tasks live here, out of My Task ── */}
              <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5E7EB", overflow: "hidden", marginBottom: 24 }}>
                <div style={{ padding: "14px 18px", borderBottom: "1px solid #F3F4F6", fontWeight: 700, fontSize: 14.5, color: "#15803D" }}>
                  {"\u2705"} Completed ({completedTasks.length})
                </div>
                {completedTasks.slice(0, 10).map(t => (
                  <div key={t.id} style={{ padding: "13px 18px", borderBottom: "1px solid #F3F4F6" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 4, flexWrap: "wrap" }}>
                      <span style={{ color: "#9CA3AF", fontFamily: "monospace", fontSize: 12 }}>{t.id}</span>
                      {t.type && <Badge text={t.type} color={typeColor(t.type)} />}
                      <Badge text="Completed" color="#10B981" />
                    </div>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{t.title}</div>
                    <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 4, lineHeight: 1.7 }}>
                      {isEA && <span>{"\u{1F464}"} {t.assigneeName || t.assignedTo} · </span>}
                      {t.reportedBy && <span>From: {getName(t.reportedBy)} · </span>}
                      {t.dueDate && <span>Due was {t.dueDate} · </span>}
                      <span style={{ color: "#15803D", fontWeight: 600 }}>Done {t.completedAt || t.createdDate}</span>
                    </div>
                  </div>
                ))}
                {completedTasks.length === 0 && (
                  <div style={{ padding: 26, textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>Nothing completed yet</div>
                )}
                {completedTasks.length > 10 && (
                  <div style={{ padding: "12px 18px", fontSize: 12, color: "#9CA3AF" }}>+ {completedTasks.length - 10} more</div>
                )}
              </div>

              <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5E7EB", overflow: "hidden" }}>
                <div style={{ padding: "14px 18px", borderBottom: "1px solid #F3F4F6", fontWeight: 700, fontSize: 14.5 }}>Recent Activity</div>
                {activity.map((item, i) => {
                  const d = item.data;
                  const isProblem = item.kind === "problem";
                  return (
                    <div key={i} style={{ padding: "15px 18px", borderBottom: "1px solid #F3F4F6", display: "flex", alignItems: "flex-start", gap: 12 }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", marginTop: 7, background: isProblem ? "#8B5CF6" : "#2D5BFF", flexShrink: 0 }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 5, flexWrap: "wrap" }}>
                          <span style={{ color: "#9CA3AF", fontFamily: "monospace", fontSize: 12 }}>{d.id}</span>
                          {isProblem && d.category && <Badge text={d.category} color="#6B7280" />}
                          {d.type && <Badge text={d.type} color={typeColor(d.type)} />}
                          <Badge text={d.status} color={statusColor(d.status)} />
                        </div>

                        <div style={{ fontSize: 14, fontWeight: 700 }}>{d.title}</div>
                        {d.description && (
                          <div style={{ fontSize: 12.5, color: "#6B7280", marginTop: 4, lineHeight: 1.55 }}>{d.description}</div>
                        )}

                        <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 6, lineHeight: 1.7 }}>
                          {isProblem ? (
                            <>
                              Sent on {d.date}
                              {d.dueDate && <span style={{ color: "#B45309", fontWeight: 600 }}> · Due: {d.dueDate}</span>}
                              {(d.suggestedName || d.suggestedTo) && (
                                <span style={{ color: "#7C3AED", fontWeight: 600 }}> · Sent to: {d.suggestedName || getName(d.suggestedTo)}</span>
                              )}
                            </>
                          ) : (
                            <>
                              {"\u{1F464}"} {d.assigneeName || d.assignedTo} · Assigned on {d.createdDate}
                              {d.dueDate && <span style={{ color: "#B45309", fontWeight: 600 }}> · Due: {d.dueDate}</span>}
                              {d.reportedBy && <span> · From: {getName(d.reportedBy)}</span>}
                              {d.linkedProblem && <span> · Linked: {d.linkedProblem}</span>}
                            </>
                          )}
                        </div>

                        {!isProblem && d.response && (
                          <div style={{ fontSize: 12, color: "#0E7490", marginTop: 5, lineHeight: 1.7 }}>
                            {"\u2713"} Accepted — will complete by <strong>{d.promisedDate || "\u2014"}</strong>
                            {d.responseNote && <span> · Note: {d.responseNote}</span>}
                            {d.respondedOn && <span style={{ opacity: 0.8 }}> · Responded {d.respondedOn}</span>}
                          </div>
                        )}
                        {!isProblem && d.completedAt && (
                          <div style={{ fontSize: 12, color: "#15803D", fontWeight: 600, marginTop: 4 }}>
                            {"\u2705"} Completed on {d.completedAt}
                          </div>
                        )}
                        {isProblem && tasksForProblem(d.id).map(t => (
                          <div key={t.id} style={{ fontSize: 12, color: "#334155", marginTop: 5, lineHeight: 1.7 }}>
                            {"\u{1F4CC}"} {t.id} with {t.assigneeName || t.assignedTo} · <span style={{ color: statusColor(t.status), fontWeight: 600 }}>{t.status}</span>
                            {t.promisedDate && <span> · will complete by <strong>{t.promisedDate}</strong></span>}
                            {t.completedAt && <span style={{ color: "#15803D", fontWeight: 600 }}> · done {t.completedAt}</span>}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
                {activity.length === 0 && (
                  <div style={{ padding: 30, textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>No activity yet</div>
                )}
              </div>

              <div className="act-row" style={{ marginTop: 20, display: "flex", gap: 10, flexWrap: "wrap" }}>
                <button className="act" style={btnP} onClick={() => setView("report")}>{"\u{1F6A8}"} New Request</button>
                <button className="act" style={btnS} onClick={() => setView("mytasks")}>{"\u{2705}"} My Task</button>
              </div>
            </div>
          )}

          {/* ═══ NEW REQUEST (everyone) ═══ */}
          {view === "report" && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>New Request</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>Pick the person and it goes straight to them</p>
              <div className="card" style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5E7EB", padding: 24, maxWidth: 600 }}>
                <div style={{ marginBottom: 16 }}>
                  <label style={lbl}>Title *</label>
                  <input style={inp} placeholder="e.g., Printer not working in dispatch room" value={problemForm.title} onChange={e => setProblemForm(f => ({ ...f, title: e.target.value }))} />
                </div>
                <div className="form-row" style={{ display: "flex", gap: 14, marginBottom: 16 }}>
                  <div style={{ flex: 1 }}>
                    <label style={lbl}>Category</label>
                    <select style={inp} value={problemForm.category} onChange={e => setProblemForm(f => ({ ...f, category: e.target.value }))}>
                      {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={lbl}>Type</label>
                    <select style={inp} value={problemForm.type}
                      onChange={e => {
                        const type = e.target.value;
                        setProblemForm(f => ({ ...f, type, dueDate: needsDue(type) ? f.dueDate : "" }));
                      }}>
                      {TYPES.map(t => <option key={t}>{t}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{ marginBottom: 16 }}>
                  <label style={lbl}>Description</label>
                  <textarea style={{ ...inp, minHeight: 96, resize: "vertical" }} placeholder="Describe it in detail..." value={problemForm.description} onChange={e => setProblemForm(f => ({ ...f, description: e.target.value }))} />
                </div>
                <div className="form-row" style={{ display: "flex", gap: 14, marginBottom: 14 }}>
                  <div style={{ flex: 1 }}>
                    <label style={lbl}>{"\u{1F464}"} Assign To</label>
                    <select style={inp} value={problemForm.suggestedTo} onChange={e => setProblemForm(f => ({ ...f, suggestedTo: e.target.value }))}>
                      <option value="">{"\u2014"} Let the EA decide {"\u2014"}</option>
                      {suggestableEmployees.map(e => <option key={e.email} value={e.email}>{e.name} — {e.dept}</option>)}
                    </select>
                  </div>
                  {needsDue(problemForm.type) && (
                    <div style={{ flex: 1 }}>
                      <label style={lbl}>{"\u{1F4C5}"} Due Date {problemForm.suggestedTo ? "*" : ""}</label>
                      <input type="date" style={inp} value={problemForm.dueDate}
                        onChange={e => setProblemForm(f => ({ ...f, dueDate: e.target.value }))} />
                    </div>
                  )}
                </div>
                <div style={{ fontSize: 11.5, color: "#9CA3AF", marginBottom: 20, lineHeight: 1.5 }}>
                  {problemForm.suggestedTo
                    ? "Submit करते ही ये task सीधे उस व्यक्ति के My Task में चला जाएगा."
                    : "किसी को नहीं चुना तो request EA के पास जाएगी और वो assign करेंगी."}
                  {!needsDue(problemForm.type) && " Complaint में due date नहीं लगती."}
                </div>
                <button className="act" style={{ ...btnP, opacity: saving ? 0.6 : 1 }} onClick={submitProblem} disabled={saving}>Submit</button>
              </div>
            </div>
          )}

          {/* ═══ MY TASK (open tasks only) ═══ */}
          {view === "mytasks" && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>My Task</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>
                Tasks given to you · finished ones move to the Dashboard
                {completedTasks.length > 0 && (
                  <span> · <span onClick={() => setView("dashboard")} style={{ color: "#15803D", fontWeight: 600, cursor: "pointer" }}>{myTasks.filter(t => t.status === "Completed").length} completed</span></span>
                )}
              </p>
              {myOpenTasks.length === 0
                ? <EmptyState icon={"\u{1F389}"} title="Nothing pending on you" subtitle="Completed tasks are on your Dashboard" />
                : <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {myOpenTasks.map(myTaskCard)}
                  </div>
              }
            </div>
          )}

          {/* ═══ TASK TRACKING ═══ */}
          {view === "tracking" && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>Task Tracking</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>
                {isEA ? "Every task in the office — who has it and where it stands" : "What you've sent and where it stands"}
              </p>

              {isEA ? (
                tasks.length === 0
                  ? <EmptyState icon={"\u{1F4CC}"} title="No tasks yet" />
                  : <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {tasks.map(eaTaskCard)}
                    </div>
              ) : (
                myProblems.length === 0
                  ? <EmptyState icon={"\u{1F4DD}"} title="Nothing sent yet" subtitle='Use "New Request" to send one' />
                  : <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {myProblems.map(p => (
                        <div key={p.id} className="card" style={{ background: "#fff", borderRadius: 12, border: `1px solid ${p.status === "Resolved" ? "#D1FAE5" : "#E5E7EB"}`, padding: 18 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 7, flexWrap: "wrap" }}>
                            <span style={{ fontFamily: "monospace", fontSize: 12, color: "#9CA3AF" }}>{p.id}</span>
                            {p.category && <Badge text={p.category} color="#6B7280" />}
                            {p.type && <Badge text={p.type} color={typeColor(p.type)} />}
                            <Badge text={p.status} color={statusColor(p.status)} />
                          </div>
                          <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 5 }}>{p.title}</div>
                          {p.description && <div style={{ fontSize: 13, color: "#6B7280", lineHeight: 1.55 }}>{p.description}</div>}
                          <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 7 }}>
                            Sent on {p.date}
                            {p.dueDate && <span style={{ color: "#B45309", fontWeight: 600 }}> · Due: {p.dueDate}</span>}
                            {(p.suggestedName || p.suggestedTo) && (
                              <span style={{ color: "#7C3AED", fontWeight: 600 }}> · Sent to: {p.suggestedName || getName(p.suggestedTo)}</span>
                            )}
                          </div>

                          {tasksForProblem(p.id).map(t => <ReporterTaskInfo key={t.id} t={t} />)}
                        </div>
                      ))}
                    </div>
              )}
            </div>
          )}

          {/* ═══ EA: PENDING ═══ */}
          {view === "pending" && isEA && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>Pending</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>
                Everything still open across the office · <strong>{pendingTasks.length} task(s)</strong>
                {overdueTasks.length > 0 && <span style={{ color: "#DC2626", fontWeight: 700 }}> · {overdueTasks.length} overdue</span>}
              </p>

              {unassignedProblems.length > 0 && (
                <div style={{ marginBottom: 26 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#7C3AED", marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>
                    Waiting for you to assign ({unassignedProblems.length})
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {unassignedProblems.map(p => (
                      <div key={p.id} className="card" style={{ background: "#fff", borderRadius: 12, border: "1px solid #DDD6FE", padding: 18 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 7, flexWrap: "wrap" }}>
                          <span style={{ fontFamily: "monospace", fontSize: 12, color: "#9CA3AF" }}>{p.id}</span>
                          {p.category && <Badge text={p.category} color="#6B7280" />}
                          {p.type && <Badge text={p.type} color={typeColor(p.type)} />}
                          <Badge text={p.status} color={statusColor(p.status)} />
                        </div>
                        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 5 }}>{p.title}</div>
                        {p.description && <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 7, lineHeight: 1.55 }}>{p.description}</div>}
                        <div style={{ fontSize: 12, color: "#9CA3AF" }}>
                          By {getName(p.reportedBy)} · {p.date}
                          {p.dueDate && <span style={{ color: "#B45309", fontWeight: 600 }}> · Due: {p.dueDate}</span>}
                        </div>
                        <button className="act" style={{ ...btnP, background: "#7C3AED", fontSize: 13.5, padding: "11px 16px", marginTop: 14 }}
                          onClick={() => {
                            setTaskForm(f => ({
                              ...f, title: p.title, description: p.description,
                              linkedProblem: p.id, type: TYPES.includes(p.type) ? p.type : "Task",
                              assignedTo: "", dueDate: p.dueDate || ""
                            }));
                            setView("assign");
                          }}>
                          Assign Task {"\u{2192}"}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {notAcceptedTasks.length > 0 && (
                <div style={{ marginBottom: 26 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#B45309", marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>
                    Not accepted yet ({notAcceptedTasks.length})
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {notAcceptedTasks.map(eaTaskCard)}
                  </div>
                </div>
              )}

              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#2D5BFF", marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>
                  In hand ({pendingTasks.filter(t => t.response).length})
                </div>
                {pendingTasks.filter(t => t.response).length === 0
                  ? <EmptyState icon={"\u{2705}"} title="Nothing in hand" subtitle="Accepted tasks that aren't finished show up here" />
                  : <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {pendingTasks.filter(t => t.response).map(eaTaskCard)}
                    </div>
                }
              </div>

              {pendingTasks.length === 0 && unassignedProblems.length === 0 && (
                <EmptyState icon={"\u{1F389}"} title="Nothing pending" subtitle="Every task is completed" />
              )}
            </div>
          )}

          {/* ═══ CONTACT ═══ */}
          {view === "team" && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>Contact</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>Tap Call or WhatsApp to reach anyone directly</p>
              {employees.length === 0
                ? <EmptyState icon={"\u{1F4DE}"} title="No contacts loaded" />
                : <div className="phone-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 14 }}>
                    {employees.map(e => <PhoneCard key={e.id || e.email} emp={e} isSelf={e.email === session.email} />)}
                  </div>
              }
            </div>
          )}

          {/* ═══ EA: ASSIGN TASK (opened from Pending) ═══ */}
          {view === "assign" && isEA && (
            <div style={{ animation: "slideIn 0.3s" }}>
              <h2 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>Assign New Task</h2>
              <p style={{ margin: "0 0 20px", color: "#6B7280", fontSize: 13.5 }}>Give the person the task and the date you need it by</p>
              <div className="card" style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5E7EB", padding: 24, maxWidth: 600 }}>
                {taskForm.linkedProblem && (
                  <div style={{ background: "#EEF2FF", border: "1px solid #C7D2FE", borderRadius: 9, padding: "10px 13px", marginBottom: 16, fontSize: 12.5, color: "#4338CA", lineHeight: 1.55 }}>
                    {"\u{1F517}"} Linked to request <strong>{taskForm.linkedProblem}</strong> — completing it will auto-resolve the request
                  </div>
                )}
                <div style={{ marginBottom: 16 }}>
                  <label style={lbl}>Task Title *</label>
                  <input style={inp} placeholder="e.g., Replace printer toner on 3rd floor" value={taskForm.title} onChange={e => setTaskForm(f => ({ ...f, title: e.target.value }))} />
                </div>
                <div style={{ marginBottom: 16 }}>
                  <label style={lbl}>Description</label>
                  <textarea style={{ ...inp, minHeight: 76, resize: "vertical" }} placeholder="Task details and instructions..." value={taskForm.description} onChange={e => setTaskForm(f => ({ ...f, description: e.target.value }))} />
                </div>
                <div className="form-row" style={{ display: "flex", gap: 14, marginBottom: 16 }}>
                  <div style={{ flex: 1, minWidth: 150 }}>
                    <label style={lbl}>Assign To *</label>
                    <select style={inp} value={taskForm.assignedTo} onChange={e => setTaskForm(f => ({ ...f, assignedTo: e.target.value }))}>
                      <option value="">-- Select Employee --</option>
                      {employees.filter(e => e.role !== "EA").map(e => <option key={e.email} value={e.email}>{e.name} — {e.dept}</option>)}
                    </select>
                  </div>
                  <div style={{ flex: 1, minWidth: 150 }}>
                    <label style={lbl}>Type</label>
                    <select style={inp} value={taskForm.type}
                      onChange={e => {
                        const type = e.target.value;
                        setTaskForm(f => ({ ...f, type, dueDate: needsDue(type) ? f.dueDate : "" }));
                      }}>
                      {TYPES.map(t => <option key={t}>{t}</option>)}
                    </select>
                  </div>
                </div>
                <div className="form-row" style={{ display: "flex", gap: 14, marginBottom: 20 }}>
                  {needsDue(taskForm.type) && (
                    <div style={{ flex: 1, minWidth: 150 }}>
                      <label style={lbl}>{"\u{1F4C5}"} Due Date *</label>
                      <input type="date" style={inp} value={taskForm.dueDate} onChange={e => setTaskForm(f => ({ ...f, dueDate: e.target.value }))} />
                    </div>
                  )}
                  <div style={{ flex: 1, minWidth: 150 }}>
                    <label style={lbl}>Link to Request</label>
                    <select style={inp} value={taskForm.linkedProblem}
                      onChange={e => {
                        const pid = e.target.value;
                        const linked = problems.find(p => p.id === pid);
                        setTaskForm(f => ({
                          ...f,
                          linkedProblem: pid,
                          dueDate: (linked && linked.dueDate) ? linked.dueDate : f.dueDate
                        }));
                      }}>
                      <option value="">{"\u{2014}"} None {"\u{2014}"}</option>
                      {unassignedProblems.map(p => <option key={p.id} value={p.id}>{p.id}: {p.title}</option>)}
                    </select>
                  </div>
                </div>
                <div className="act-row" style={{ display: "flex", gap: 10 }}>
                  <button className="act" style={{ ...btnP, opacity: saving ? 0.6 : 1 }} onClick={submitTask} disabled={saving}>Assign Task</button>
                  <button className="act" style={btnS} onClick={() => setView("pending")}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          {/* Sign out on phone */}
          <div style={{ marginTop: 26, textAlign: "center" }}>
            <button onClick={handleLogout}
              style={{ display: "inline-block", padding: "10px 20px", borderRadius: 9, border: "1px solid #E5E7EB", background: "#fff", cursor: "pointer", fontSize: 12.5, color: "#9CA3AF", fontWeight: 500 }}>
              Sign out
            </button>
          </div>

        </main>
      </div>

      {/* Bottom tab bar — phone only */}
      <nav className="tabbar">
        {navItems.map(item => (
          <button key={item.key} className="tabbtn" onClick={() => setView(item.key)}
            style={{ color: view === item.key ? "#2D5BFF" : "#9CA3AF", background: view === item.key ? "#EEF2FF" : "none", position: "relative" }}>
            <span style={{ fontSize: 18 }}>{item.icon}</span>
            {item.label}
            {item.key === "pending" && pendingTasks.length + unassignedProblems.length > 0 && (
              <span style={{ position: "absolute", top: 2, right: "50%", marginRight: -20, background: "#EF4444", color: "#fff", borderRadius: 999, fontSize: 9.5, fontWeight: 700, padding: "1px 5px" }}>
                {pendingTasks.length + unassignedProblems.length}
              </span>
            )}
            {item.key === "mytasks" && myOpenTasks.length > 0 && (
              <span style={{ position: "absolute", top: 2, right: "50%", marginRight: -20, background: "#2D5BFF", color: "#fff", borderRadius: 999, fontSize: 9.5, fontWeight: 700, padding: "1px 5px" }}>
                {myOpenTasks.length}
              </span>
            )}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ══════════════════════════════════════════════════
// ║  ROOT APP
// ══════════════════════════════════════════════════
function App() {
  const [session, setSession] = useState(() => {
    try {
      const stored = sessionStorage.getItem('officedesk_session');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Date.now() - parsed.loginTime < 8 * 60 * 60 * 1000) return parsed;
        sessionStorage.removeItem('officedesk_session');
      }
    } catch {}
    return null;
  });

  if (!session) return <LoginScreen onLogin={setSession} />;
  return <Dashboard session={session} onLogout={() => setSession(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
